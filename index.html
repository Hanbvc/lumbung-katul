<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>JPN Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>try{var m=localStorage.getItem('lk-ui');document.documentElement.setAttribute('data-ui',m==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-ui','dark');}</script>
<style>
/* Layout: an operations cockpit. Header + module tabs on top, a dense grid of instrument panels below.
   Dark navy is the default look; the header toggle switches to a light console. Lime marks live state and the main action;
   each KPI panel carries its own instrument colour; red/amber/orange only ever mean severity. */
:root{
  --bg:#0a1120; --panel:#101a2c; --panel-2:#0c1527; --panel-3:#18253d; --line:#1d2a42; --line-2:#2b3b58;
  --ink:#e7eef9; --ink-2:#a3b2c9; --ink-3:#71819c;
  --lime:#b5e61d; --on-lime:#0b1300; --lime-text:#c6f04a; --lime-wash:rgba(181,230,29,.12);
  --c-green:#22c55e; --c-violet:#a78bfa; --c-amber:#f5b83d; --c-red:#f87171; --c-blue:#60a5fa;
  --s1:#0d9f6e; --s2:#8b5cf6; --s3:#bd8105;
  --good:#22c55e; --warn:#f5b83d; --serious:#fb923c; --crit:#ef4444; --info:#60a5fa;
  --good-text:#4ade80; --warn-text:#fbbf24; --serious-text:#fdba74; --crit-text:#f87171; --info-text:#93c5fd;
  --good-wash:rgba(34,197,94,.13); --warn-wash:rgba(245,184,61,.13); --serious-wash:rgba(251,146,60,.14); --crit-wash:rgba(239,68,68,.14); --info-wash:rgba(96,165,250,.13);
  --grid:#18243a; --axis:#2b3b58; --focus:#60a5fa;
  --sea:#0b1526; --land:#162238; --coast:#33476b;
  --shadow:0 24px 60px -20px rgba(0,0,0,.7); --scrim:rgba(3,7,16,.66);
  --paper-shadow:0 2px 20px rgba(0,0,0,.4);
  --f-num:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
:root[data-ui="light"]{
  --bg:#eef2f8; --panel:#ffffff; --panel-2:#f5f8fc; --panel-3:#e8eef6; --line:#dbe3ee; --line-2:#c4cfde;
  --ink:#0f1a2c; --ink-2:#44526a; --ink-3:#66748b;
  --lime:#4d7c0f; --on-lime:#ffffff; --lime-text:#3f6a07; --lime-wash:rgba(77,124,15,.1);
  --c-green:#16a34a; --c-violet:#7c3aed; --c-amber:#d97706; --c-red:#dc2626; --c-blue:#2563eb;
  --s1:#059669; --s2:#7c3aed; --s3:#d97706;
  --good:#16a34a; --warn:#d99a06; --serious:#ea580c; --crit:#dc2626; --info:#2563eb;
  --good-text:#15803d; --warn-text:#9a6700; --serious-text:#c2410c; --crit-text:#b91c1c; --info-text:#1d4ed8;
  --good-wash:rgba(22,163,74,.1); --warn-wash:rgba(217,154,6,.12); --serious-wash:rgba(234,88,12,.1); --crit-wash:rgba(220,38,38,.09); --info-wash:rgba(37,99,235,.09);
  --grid:#e6ecf4; --axis:#c4cfde; --focus:#2563eb;
  --sea:#e3ecf7; --land:#ffffff; --coast:#a9b8cd;
  --shadow:0 24px 60px -24px rgba(15,26,44,.35); --scrim:rgba(15,26,44,.42);
  --paper-shadow:0 2px 14px rgba(15,26,44,.12);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;color:var(--ink)}
p{margin:0}
a{color:var(--lime-text)}
button{cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{flex:none}
.mono{font-family:var(--f-mono);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)} .small{font-size:12px} .nowrap{white-space:nowrap}
.good-t{color:var(--good-text)} .crit-t{color:var(--crit-text)} .warn-t{color:var(--warn-text)} .serious-t{color:var(--serious-text)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* frame: left rail + main */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.brand{display:flex;gap:11px;align-items:center;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;color:var(--lime);background:var(--lime-wash);border:1px solid color-mix(in srgb,var(--lime) 35%,transparent);flex:none}
.logo svg{width:20px;height:20px}
.hdr-name{font-family:var(--f-mono);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.hdr-sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.hdr-chip{display:block;margin-top:5px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 7px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;background:none;cursor:pointer;text-align:left}
.hdr-chip:hover{color:var(--ink);border-color:var(--ink-3)}
.nav{flex:1;overflow-y:auto;padding:6px 10px 14px}
.nav-g{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-size:13px;font-weight:500}
.nav a svg{width:16px;height:16px;color:var(--ink-3)}
.nav a:hover{background:var(--panel-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--panel-3);color:var(--ink)}
.nav a[aria-current="page"] svg{color:var(--lime)}
.badge{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;font-weight:600;min-width:20px;padding:0 6px;border-radius:999px;background:var(--panel-3);color:var(--ink-2);text-align:center}
.badge.hot{background:var(--crit);color:#fff}
.rail-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rail-foot .upd{font-size:11px}
.main{min-width:0;display:flex;flex-direction:column}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,2vw,24px)}
.icon-btn.menu-btn{display:none}
.hdr-sp{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--good-text);border:1px solid color-mix(in srgb,var(--good) 40%,var(--line));background:var(--good-wash);border-radius:6px;padding:4px 10px;white-space:nowrap;align-self:flex-start}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:ping 2s infinite}
.live.local{color:var(--warn-text);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-wash)}
.live.local i{background:var(--warn);animation:none}
.live.wait{color:var(--ink-3);border-color:var(--line-2);background:none}.live.wait i{background:var(--ink-3);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.clock{font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.upd{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.search{position:relative;width:min(360px,34vw)}
.search>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.search input{padding-left:32px!important;min-height:34px!important;background:var(--panel)!important}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px var(--f-mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.pop{position:absolute;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:40}
.sresults{left:0;right:0;max-height:62vh;overflow:auto;min-width:300px}
.pop button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:left}
.pop button:hover,.pop button.on{background:var(--panel-3)}
.pop svg{width:16px;height:16px;color:var(--ink-3)}
.pop .k{font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.pop .s-main{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .s-empty{padding:10px;color:var(--ink-3);font-size:13px}
.create{position:relative}
.create .pop{right:0;min-width:240px}
.scrim-nav{display:none}
.view{padding-inline:clamp(12px,2vw,24px);padding-block:18px 64px;display:flex;flex-direction:column;gap:14px;width:100%;max-width:1600px;margin:0 auto}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 13px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-3);border-color:var(--ink-3)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--on-lime);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-3);color:var(--ink)}
.btn.danger{color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.danger:hover{background:var(--crit-wash)}
.btn.sm{min-height:28px;padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--panel-3);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.sm{width:26px;height:26px} .icon-btn.sm svg{width:14px;height:14px}
.icon-btn.bordered{border-color:var(--line-2)}
.link{border:0;background:none;color:var(--lime-text);font-weight:500;font-size:12px;padding:2px 0;text-align:left}
.link:hover{text-decoration:underline}
input[type=text],input[type=date],input[type=month],input[type=search],input[type=tel],input:not([type]),select,textarea{width:100%;min-height:36px;padding:6px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel-2);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--lime)}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:3px 9px;white-space:nowrap;background:var(--panel-2)}
button.tag:hover{border-color:var(--ink-3);color:var(--ink)}

/* page & panels */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph h1{font-size:20px;font-weight:600;letter-spacing:-.005em}
.ph p{color:var(--ink-3);margin-top:3px;max-width:72ch;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;position:relative;container-type:inline-size}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 14px;flex-wrap:wrap}
.card-h h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px}
.card-h h3 .hi{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--panel-3);color:var(--ink-2)}
.card-h h3 .hi svg{width:14px;height:14px}
.card-h h3 small{font-weight:400;color:var(--ink-3);font-size:12.5px}
.card-h .sub{font-size:12px;color:var(--ink-3)}
.card-b{padding:2px 14px 14px}
.card-f{padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c12{grid-column:span 12}.c9{grid-column:span 9}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:1280px){.c9,.c8,.c7,.c5{grid-column:span 12}.c4{grid-column:span 6}.c3{grid-column:span 6}.c6{grid-column:span 12}}
@media (max-width:720px){.c4,.c3{grid-column:span 12}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel-2)}
.grow{flex:1}
.tb-search{position:relative;flex:1 1 220px;max-width:340px}
.tb-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.tb-search input{padding-left:32px}
.inline-sel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.inline-sel select,.inline-sel input{width:auto;min-height:32px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 9px 9px;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:500;white-space:nowrap;display:inline-flex;gap:7px;align-items:center;font-size:13px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lime)}
.cnt{font-family:var(--f-mono);font-size:10.5px;padding:0 6px;border-radius:999px;background:var(--panel-3);color:var(--ink-2)}
.seg{display:inline-flex;padding:2px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:3px 9px;border-radius:5px;color:var(--ink-3);font-family:var(--f-mono);font-size:11px}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--ink)}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-family:var(--f-mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t th:first-child,.t td:first-child{padding-left:14px}
.t th:last-child,.t td:last-child{padding-right:14px}
.t tbody tr:last-child td{border-bottom:0}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:var(--panel-2)}
.t th.num,.t td.num{text-align:right}
.t tfoot td{font-weight:600;border-top:1px solid var(--line-2);border-bottom:0;background:var(--panel-2)}
.t tfoot tr.sub td{font-weight:400;background:var(--panel);border-top:0;padding-block:5px;color:var(--ink-2)}
.t td.sev-crit{box-shadow:inset 3px 0 0 var(--crit)} .t td.sev-serious{box-shadow:inset 3px 0 0 var(--serious)} .t td.sev-warn{box-shadow:inset 3px 0 0 var(--warn)} .t td.sev-info{box-shadow:inset 3px 0 0 var(--info)}
.t tr.dim td{opacity:.55}
.cell-main{font-weight:500;color:var(--ink)}
.cell-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.tbl-foot{padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono)}

/* state marks */
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 8px 1px 7px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dot,var(--ink-3));flex:none}
.pill.good{--dot:var(--good)} .pill.warn{--dot:var(--warn)} .pill.serious{--dot:var(--serious)} .pill.crit{--dot:var(--crit)} .pill.info{--dot:var(--info)} .pill.gold,.pill.lime{--dot:var(--lime)}
.sev{display:inline-block;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap;background:none}
.sev.crit{color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 55%,transparent);background:var(--crit-wash)}
.sev.serious{color:var(--serious-text);border-color:color-mix(in srgb,var(--serious) 55%,transparent);background:var(--serious-wash)}
.sev.warn{color:var(--warn-text);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-wash)}
.sev.info{color:var(--info-text);border-color:color-mix(in srgb,var(--info) 55%,transparent);background:var(--info-wash)}
.sev.good{color:var(--good-text);border-color:color-mix(in srgb,var(--good) 55%,transparent);background:var(--good-wash)}
.sev.mute{color:var(--ink-3);border-color:var(--line-2)}
button.sev{cursor:pointer}
.chip{display:inline-block;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:0 5px;border-radius:4px;background:var(--panel-3);color:var(--ink-2);vertical-align:1px}
.chip.peternak{background:var(--lime-wash);color:var(--lime-text)}
.demo-tag{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}

/* instruments */
.ident{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:16px;align-items:center;padding:14px 16px}
.id-l{display:flex;gap:14px;align-items:center;min-width:0}
.id-ic{position:relative;width:46px;height:46px;border-radius:10px;border:1.5px solid var(--lime);background:var(--lime-wash);color:var(--lime);display:grid;place-items:center;flex:none}
.id-ic svg{width:24px;height:24px}
.id-ic i{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid var(--panel)}
.id-ic i.bad{background:var(--crit)}
.id-name{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.id-name b{font-size:19px;font-weight:600}
.id-sub{font-size:12px;color:var(--ink-3);margin-top:3px}
.id-stats{display:flex;flex-wrap:wrap}
.istat{padding:2px 18px;border-left:1px solid var(--line);min-width:110px}
.istat b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.istat span:last-child{font-size:11.5px;color:var(--ink-3)}
@media (max-width:1100px){.ident{grid-template-columns:1fr}.istat:first-child{border-left:0;padding-left:0}.id-stats{gap:10px 0}}

<script id="core">
/* Core business rules: no DOM here, so the same code seeds the demo data. */
var Core = (function () {
  'use strict';
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseISO = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
  const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
  const sum = (arr, f) => arr.reduce((t, x) => t + (Number(f ? f(x) : x) || 0), 0);
  const yymm = s => s.slice(2, 4) + s.slice(5, 7);
  const MONL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  const orderSubtotal = o => sum(o.items || [], i => i.qtyKg * i.price);
  const orderNet = o => orderSubtotal(o) - (o.discount || 0);
  const orderTotal = o => orderNet(o) + (o.freight || 0);
  const orderKg = o => sum(o.items || [], i => i.qtyKg);
  const orderCogs = o => sum(o.fifo || [], f => f.qty * f.cost);
  const paidOf = x => sum(x.payments || [], p => p.amount);
  const isShipped = o => o.status === 'dikirim' || o.status === 'selesai';
  const purchaseKg = p => p.status === 'diterima' ? (p.receivedKg || 0) : (p.qtyKg || 0);
  const purchaseTotal = p => purchaseKg(p) * (p.pricePerKg || 0) + (p.freight || 0);

  // Stock is derived, never stored: received purchases are batches, shipped orders draw them down (FIFO), adjustments correct them.
  function computeBatches(D) {
    const map = {};
    for (const p of Object.values(D.purchases || {})) {
      if (p.status !== 'diterima' || !(p.receivedKg > 0)) continue;
      map[p.id] = { id: p.id, code: p.batchCode || p.no, productId: p.productId, supplierId: p.supplierId, purchaseNo: p.no,
        dateIn: p.receivedDate || p.date, qtyIn: p.receivedKg, cost: purchaseTotal(p) / p.receivedKg, moisture: p.moisture, used: 0, adj: 0 };
    }
    for (const o of Object.values(D.orders || {})) {
      if (!isShipped(o)) continue;
      for (const f of o.fifo || []) if (map[f.batchId]) map[f.batchId].used += f.qty;
    }
    for (const a of Object.values(D.adjustments || {})) if (map[a.batchId]) map[a.batchId].adj += a.qty;
    const list = Object.values(map);
    list.forEach(b => { b.left = Math.max(0, Math.round((b.qtyIn - b.used + b.adj) * 100) / 100); });
    list.sort((a, b) => a.dateIn === b.dateIn ? String(a.code).localeCompare(String(b.code)) : (a.dateIn < b.dateIn ? -1 : 1));
    return list;
  }

  function allocate(batches, items) {
    const left = {}; batches.forEach(b => { left[b.id] = b.left; });
    const fifo = [], short = {};
    for (const it of items) {
      let need = Number(it.qtyKg) || 0;
      for (const b of batches) {
        if (need <= 0) break;
        if (b.productId !== it.productId || left[b.id] <= 0) continue;
        const take = Math.min(need, left[b.id]);
        left[b.id] -= take; need -= take;
        const ex = fifo.find(f => f.batchId === b.id);
        if (ex) ex.qty += take; else fifo.push({ batchId: b.id, productId: b.productId, qty: take, cost: Math.round(b.cost * 100) / 100 });
      }
      if (need > 0.001) short[it.productId] = (short[it.productId] || 0) + need;
    }
    return { fifo, short };
  }

  function nextNo(prefix, nos, dateISO) {
    const head = `${prefix}-${yymm(dateISO)}-`;
    let max = 0;
    for (const n of nos) if (n && String(n).startsWith(head)) max = Math.max(max, parseInt(String(n).slice(head.length), 10) || 0);
    return head + String(max + 1).padStart(3, '0');
  }
  function nextCode(prefix, codes, width) {
    let max = 0;
    for (const c of codes) { const m = String(c || '').match(new RegExp('^' + prefix + '-(\\d+)$')); if (m) max = Math.max(max, +m[1]); }
    return `${prefix}-${String(max + 1).padStart(width || 3, '0')}`;
  }

/* ---------- views: reports ---------- */
function repRange() {
  const T = today(), d = parseISO(T), y = d.getFullYear(), m = d.getMonth();
  switch (S.f.repPeriod) {
    case 'bulan-ini': return [iso(new Date(y, m, 1)), T, `${MONL[m]} ${y}`];
    case 'bulan-lalu': return [iso(new Date(y, m - 1, 1)), iso(new Date(y, m, 0)), `${MONL[(m + 11) % 12]} ${m === 0 ? y - 1 : y}`];
    case '90': return [addDays(T, -89), T, '90 hari terakhir'];
    case 'tahun-ini': return [`${y}-01-01`, T, `Tahun ${y}`];
    case 'kustom': { const a = S.f.repFrom || T, b = S.f.repTo || T; return a <= b ? [a, b, `${dmy(a)} – ${dmy(b)}`] : [b, a, `${dmy(b)} – ${dmy(a)}`]; }
    default: return [addDays(T, -29), T, '30 hari terakhir'];
  }
}
function report(a, b) {
  const x = X(), sh = x.shipped.filter(o => o.shippedDate >= a && o.shippedDate <= b);
  const r = { n: sh.length, kg: sum(sh, orderKg), gross: sum(sh, orderSubtotal), disc: sum(sh, o => o.discount || 0), freight: sum(sh, o => o.freight || 0), cogs: sum(sh, orderCogs) };
  r.net = r.gross - r.disc; r.gp = r.net + r.freight - r.cogs;
  const ex = x.expenses.filter(e => e.date >= a && e.date <= b);
  r.exCat = {}; ex.forEach(e => { r.exCat[e.category] = (r.exCat[e.category] || 0) + e.amount; }); r.ex = sum(ex, e => e.amount);
  r.shrink = -sum(x.adjustments.filter(j => j.date >= a && j.date <= b), j => j.qty * ((x.batchMap[j.batchId] || {}).cost || 0));
  r.np = r.gp - r.ex - r.shrink;
  const byP = {}, byC = {}, byType = { toko: 0, peternak: 0 }, byArea = {};
  sh.forEach(o => {
    const ratio = orderSubtotal(o) ? orderNet(o) / orderSubtotal(o) : 1, c = custOf(o.customerId);
    (o.items || []).forEach(i => { const p = byP[i.productId] || (byP[i.productId] = { kg: 0, rev: 0, cogs: 0 }); p.kg += i.qtyKg; p.rev += i.qtyKg * i.price * ratio; });
    (o.fifo || []).forEach(f => { (byP[f.productId] || (byP[f.productId] = { kg: 0, rev: 0, cogs: 0 })).cogs += f.qty * f.cost; });
    const cc = byC[o.customerId] || (byC[o.customerId] = { kg: 0, rev: 0, cogs: 0, n: 0 }); cc.kg += orderKg(o); cc.rev += orderNet(o); cc.cogs += orderCogs(o); cc.n++;
    byType[c.type === 'peternak' ? 'peternak' : 'toko'] += orderNet(o);
    const k = kab(c.area); byArea[k] = (byArea[k] || 0) + orderNet(o);

  const bySup = {};

}

/* ---------- month picker (Safari on Mac has no native month input) ---------- */
function monthSel(key) {
  const T = today(), list = [], d = parseISO(T); d.setDate(1);
  for (let i = 0; i < 24; i++) { list.push([iso(d).slice(0, 7), `${MONL[d.getMonth()]} ${d.getFullYear()}`]); d.setMonth(d.getMonth() - 1); }
  if (!list.some(o => o[0] === S.f[key])) { const md = parseISO(S.f[key] + '-01'); list.unshift([S.f[key], `${MONL[md.getMonth()]} ${md.getFullYear()}`]); }
  return `<span class="mstep"><button type="button" class="icon-btn sm bordered" data-act="month-step" data-k="${key}" data-d="-1" aria-label="Bulan sebelumnya">${I.chevL}</button><select id="f-${key}" data-f="${key}" aria-label="Pilih bulan">${opts(list, S.f[key])}</select><button type="button" class="icon-btn sm bordered" data-act="month-step" data-k="${key}" data-d="1" aria-label="Bulan berikutnya" ${S.f[key] >= monthOf(T) ? 'disabled' : ''}>${I.chevR}</button></span>`;
}

    <div class="boxed tw"><table class="t"><thead><tr><th>Produk</th><th class="num">Berat</th><th class="num">Sak</th><th class="num">Harga/kg</th><th class="num">Subtotal</th></tr></thead><tbody>${(o.items || []).map(i => `<tr><td class="cell-main">${esc(prodOf(i.productId).name)}</td><td class="num">${kgf(i.qtyKg)}</td><td class="num">${sakf(i.qtyKg)}</td><td class="num">${rp(i.price)}</td><td class="num">${rp(i.qtyKg * i.price)}</td></tr>`).join('')}</tbody>
      <tfoot>${o.discount ? `<tr class="sub"><td colspan="4">Diskon</td><td class="num">−${rp(o.discount)}</td></tr>` : ''}${o.freight ? `<tr class="sub"><td colspan="4">Ongkos kirim</td><td class="num">${rp(o.freight)}</td></tr>` : ''}<tr><td colspan="4">Total · ${kgf(orderKg(o))}</td><td class="num">${rp(total)}</td></tr></tfoot></table></div>
    ${shipped ? `<div class="minis"><div class="mini"><span>HPP katul (FIFO)</span><b>${rp(cogs)}</b></div><div class="mini"><span>Laba kotor</span><b class="${gp < 0 ? 'crit-t' : ''}">${rp(gp)}</b></div><div class="mini"><span>Margin</span><b>${pctf(net ? gp / net * 100 : 0)}</b></div></div>
    <div><div class="sect-t">Batch yang dipakai</div><div class="boxed tw"><table class="t"><thead><tr><th>Batch</th><th>Produk</th><th class="num">Diambil</th><th class="num">HPP/kg</th></tr></thead><tbody>${(o.fifo || []).map(f => `<tr class="row" data-act="open-purchase" data-id="${f.batchId}"><td class="mono">${esc((x.batchMap[f.batchId] || {}).code || f.batchId)}</td><td class="small">${esc(prodOf(f.productId).name)}</td><td class="num">${kgf(f.qty)}</td><td class="num">${rp(f.cost)}</td></tr>`).join('')}</tbody></table></div></div>
    <div><div class="sect-t"><span>Pembayaran · ${st === 'lunas' ? '<span class="good-t">Lunas</span>' : `sisa ${rp(bal)}`}</span>${w && bal > 0.5 ? `<button type="button" class="btn sm" data-act="pay" data-kind="order" data-id="${id}">${I.plus}Catat pembayaran</button>` : ''}</div>${payList('order', o)}</div>` : ''}
    ${o.note ? `<div class="note">${esc(o.note)}</div>` : ''}
  </div><div class="modal-f">${acts.join('')}</div>`;
}
/* ---------- ship ---------- */
function bestVehicle(kg) { const vs = X().vehicles.slice().sort((a, b) => a.capacityKg - b.capacityKg); return (vs.find(v => v.capacityKg >= kg) || vs[vs.length - 1] || {}).id || ''; }
function openShip(id) {
  if (!guardWrite()) return;
  const o = S.D.orders[id]; if (!o) return;
  if (o.status !== 'dikonfirmasi' && o.status !== 'draft') return toast('Pesanan ini sudah dikirim atau dibatalkan.', 'warn');
  const x = X(), T = x.T, kg = orderKg(o), { fifo, short } = allocate(x.batches, o.items), shortL = Object.entries(short);
  const cogs = sum(fifo, f => f.qty * f.cost), net = orderNet(o), gp = net + (o.freight || 0) - cogs, total = orderTotal(o);
  const vid = o.vehicleId || bestVehicle(kg), v = S.D.vehicles[vid];
  openModal({
    title: `Kirim ${esc(o.no)}`, sub: `${esc(custOf(o.customerId).name)} · ${kgf(kg)} (${sakf(kg)})`, size: 'lg', dismissable: false,
    html: `<form id="f-ship" novalidate><div class="modal-b">
      ${shortL.length ? `<div class="note crit"><b>Stok tidak cukup.</b> ${shortL.map(([pid, q]) => `${esc(prodOf(pid).name)} kurang ${kgf(q)}`).join(', ')}. Terima pembelian yang sedang dipesan atau ubah jumlah pesanan.<div class="acts" style="margin-top:8px"><button type="button" class="btn sm" data-act="edit-order" data-id="${id}" data-closeup="1">Ubah pesanan</button><button type="button" class="btn sm" data-act="new-purchase" data-prod="${shortL[0][0]}">Catat pembelian</button></div></div>` : ''}
      <div class="form-grid three">
        <label class="fld"><span>Tanggal kirim</span><input type="date" id="sh-date" value="${T}"></label>
        <label class="fld"><span>Kendaraan</span><select id="sh-veh">${vehOpts(vid, 'Tanpa kendaraan sendiri')}</select></label>
        <label class="fld"><span>Sopir</span><input type="text" id="sh-driver" value="${esc(o.driver || (v ? v.driver : '') || '')}"></label>
      </div>
      <div id="sh-cap"></div>
      ${!shortL.length ? `<div><div class="sect-t">Stok yang akan dipotong (FIFO, batch tertua dulu)</div><div class="boxed tw"><table class="t"><thead><tr><th>Batch</th><th>Produk</th><th>Umur</th><th class="num">Diambil</th><th class="num">HPP/kg</th></tr></thead><tbody>${fifo.map(f => { const b = x.batchMap[f.batchId], age = diffDays(T, b.dateIn), [al, ak] = ageInfo(age); return `<tr><td class="mono">${esc(b.code)}</td><td class="small">${esc(prodOf(f.productId).name)}</td><td>${pill(`${age} hari · ${al}`, ak)}</td><td class="num">${kgf(f.qty)}</td><td class="num">${rp(f.cost)}</td></tr>`; }).join('')}</tbody></table></div></div>
      <div class="minis"><div class="mini"><span>Total tagihan</span><b>${rp(total)}</b></div><div class="mini"><span>HPP</span><b>${rp(cogs)}</b></div><div class="mini"><span>Laba kotor</span><b>${rp(gp)} · ${pctf(net ? gp / net * 100 : 0)}</b></div></div>
      <label class="check"><input type="checkbox" id="sh-cash" ${+o.termDays === 0 ? 'checked' : ''}> Pembayaran ${rp(total)} sudah diterima saat kirim (tunai/transfer)</label>` : ''}
      <p class="form-err" hidden></p>
    </div><div class="modal-f"><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary" ${shortL.length ? 'disabled' : ''}>${I.truck}Kirim & potong stok</button></div></form>`,
    onMount(el, m) {
      const f = el.querySelector('#f-ship');
      const cap = () => { const vv = S.D.vehicles[f.querySelector('#sh-veh').value]; f.querySelector('#sh-cap').innerHTML = vv && kg > vv.capacityKg ? `<div class="note warn">Berat ${kgf(kg)} melebihi kapasitas ${esc(vv.name)} (${kgf(vv.capacityKg)}). Pertimbangkan dua rit.</div>` : ''; };
      f.querySelector('#sh-veh').addEventListener('change', e => { const vv = S.D.vehicles[e.target.value]; f.querySelector('#sh-driver').value = vv ? (vv.driver || '') : ''; cap(); });
      cap();
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const cur = S.D.orders[id]; if (!cur || cur.status === 'dikirim' || cur.status === 'selesai') { m.close(); return; }
        const res = allocate(X().batches, cur.items);
        if (Object.keys(res.short).length) return formError(el, 'Stok berubah dan tidak lagi cukup. Tutup lalu periksa stok.');
        const date = f.querySelector('#sh-date').value || T;
        const patch = { status: 'dikirim', shippedDate: date, dueDate: addDays(date, +cur.termDays || 0), vehicleId: f.querySelector('#sh-veh').value, driver: f.querySelector('#sh-driver').value.trim(), fifo: res.fifo, confirmedDate: cur.confirmedDate || date };
        const cash = f.querySelector('#sh-cash');
        if (cash && cash.checked) patch.payments = (cur.payments || []).concat([{ id: uid('pay'), date, amount: orderTotal(cur) - paidOf(cur), method: +cur.termDays ? 'Transfer bank' : 'Tunai', note: 'Dibayar saat kirim', ...(+cur.termDays && accountsOf().length ? { transfer: { to: accLabel(accountsOf()[0]), from: '', sender: '', ref: '', verified: false } } : {}) }]);
        await saving($$('button', f), async () => { await Store.patch('orders', id, patch); m.close(); toast(`${cur.no} dikirim. Stok terpotong ${kgf(orderKg(cur))}.`, 'good'); });
      });
    }
  });
}

function payList(kind, d) {
  const ps = (d.payments || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (!ps.length) return '<p class="muted small">Belum ada pembayaran.</p>';
  return `<div class="boxed tw"><table class="t"><thead><tr><th>Tanggal</th><th>Metode</th><th>Catatan</th><th>Cek mutasi</th><th class="num">Jumlah</th><th></th></tr></thead><tbody>${ps.map(p => `<tr><td class="nowrap">${dmy(p.date)}</td><td class="small">${esc(p.method || '')}${p.transfer ? `<div class="cell-sub">${esc(payDetail(p))}</div>` : ''}</td><td class="small ink2">${esc(p.note || '')}</td><td>${verifyCell(kind, d.id, p)}</td><td class="num">${rp(p.amount)}</td><td class="num">${canW() ? `<button type="button" class="icon-btn sm" data-act="pay-del" data-kind="${kind}" data-id="${d.id}" data-pid="${p.id}" aria-label="Hapus pembayaran">${I.trash}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
function verifyCell(kind, docId, p) {
  if (!p.transfer) return '<span class="muted small">—</span>';
  if (p.transfer.verified) return canW() ? `<button type="button" class="sev good" data-act="pay-verify" data-kind="${kind}" data-id="${docId}" data-pid="${p.id}" data-tip="Tandai belum dicek">Sudah dicek</button>` : '<span class="sev good">Sudah dicek</span>';
  return canW() ? `<button type="button" class="sev warn" data-act="pay-verify" data-kind="${kind}" data-id="${docId}" data-pid="${p.id}" data-tip="Tandai sudah dicek di mutasi rekening">Belum dicek</button>` : '<span class="sev warn">Belum dicek</span>';
}

/* ---------- payments ---------- */
function openPay(kind, id) {
  if (!guardWrite()) return;
  const d = kind === 'order' ? S.D.orders[id] : S.D.purchases[id]; if (!d) return;
  const total = kind === 'order' ? orderTotal(d) : purchaseTotal(d), paid = paidOf(d), bal = Math.max(0, total - paid);
  if (bal < 0.5) return toast('Tagihan ini sudah lunas.', 'good');
  const incoming = kind === 'order', cust = incoming ? custOf(d.customerId) : null, sup = incoming ? null : supOf(d.supplierId);
  const who = incoming ? cust.name : sup.name, accs = accountsOf();
  const defMethod = incoming && !+d.termDays ? 'Tunai' : 'Transfer bank';
  const accOpts = accs.map(a => [a.id, accLabel(a)]);
  const supAcc = sup && sup.bankAcc ? `${sup.bank || ''} ${sup.bankAcc}${sup.bankHolder ? ' a.n. ' + sup.bankHolder : ''}`.trim() : '';
  const noAcc = `<div class="note warn span-2">Belum ada rekening perusahaan. ${canW() ? '<button type="button" class="link" data-act="acc-add" data-closeup="1">Tambah rekening</button> di Pengaturan agar bisa dipilih di sini.' : ''}</div>`;
  const tfHtml = incoming
    ? `${accs.length ? `<label class="fld"><span>Masuk ke rekening</span><select id="p-to">${opts(accOpts, accs[0].id)}</select></label>` : noAcc}
       <label class="fld"><span>Bank pengirim</span><select id="p-from">${opts(BANKS.map(b => [b, b]), 'BCA')}</select></label>
       <label class="fld"><span>Nama pengirim</span><input type="text" id="p-sender" value="${esc(cust.contact || cust.name || '')}"></label>
       <label class="fld"><span>No. referensi / berita transfer</span><input type="text" id="p-ref" placeholder="mis. ${esc(d.no)}"></label>`
    : `${accs.length ? `<label class="fld"><span>Dari rekening</span><select id="p-from">${opts(accOpts, accs[0].id)}</select></label>` : noAcc}
       <label class="fld"><span>Ke rekening pemasok</span><input type="text" id="p-to" value="${esc(supAcc)}" placeholder="mis. BRI 0123-01-000000-50-1 a.n. Pak Harun"></label>
       <label class="fld span-2"><span>No. referensi / berita transfer</span><input type="text" id="p-ref" placeholder="mis. ${esc(d.no)}"></label>`;
  openModal({
    title: incoming ? 'Catat pembayaran masuk' : 'Catat pembayaran ke pemasok', sub: `${esc(d.no)} · ${esc(who)}`, dismissable: false,
    html: `<form id="f-pay" novalidate><div class="modal-b">
      <div class="minis"><div class="mini"><span>Total</span><b>${rpS(total)}</b></div><div class="mini"><span>Sudah dibayar</span><b>${rpS(paid)}</b></div><div class="mini"><span>Sisa</span><b>${rp(bal)}</b></div></div>
      <label class="fld"><span>Jumlah dibayar (Rp)</span>${moneyIn('p-amt', bal, 'autofocus')}<span class="acts"><button type="button" class="btn sm" data-fill="${Math.round(bal)}">Lunas</button><button type="button" class="btn sm" data-fill="${Math.round(bal / 2)}">Setengah</button></span></label>
      <div class="form-grid"><label class="fld"><span>Tanggal</span><input type="date" id="p-date" value="${today()}"></label><label class="fld"><span>Metode</span><select id="p-method">${opts(PAY_METHODS.map(x => [x, x]), defMethod)}</select></label></div>
      <div class="form-grid" id="p-tf" ${defMethod === 'Transfer bank' ? '' : 'hidden'}>${tfHtml}
        <label class="check span-2"><input type="checkbox" id="p-ver" ${incoming ? '' : 'checked'}> ${incoming ? 'Sudah dicek masuk di mutasi rekening' : 'Transfer sudah berhasil (ada bukti dari bank)'}</label></div>
      <label class="fld"><span>Catatan</span><input type="text" id="p-note" placeholder="${incoming ? 'mis. pelunasan dua faktur sekaligus' : 'mis. pelunasan penerimaan minggu ini'}"></label>
      <p class="form-err" hidden></p></div>
      <div class="modal-f"><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary">${I.check}Simpan pembayaran</button></div></form>`,
    onMount(el, m) {
      const f = el.querySelector('#f-pay');
      $$('[data-fill]', f).forEach(b => b.addEventListener('click', () => { f.querySelector('#p-amt').value = NF.format(+b.dataset.fill); }));
      f.querySelector('#p-method').addEventListener('change', e => { f.querySelector('#p-tf').hidden = e.target.value !== 'Transfer bank'; });
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const amt = num(f.querySelector('#p-amt').value);
        if (!(amt > 0)) return formError(el, 'Isi jumlah pembayaran.');
        if (amt > bal + 1) return formError(el, `Jumlah melebihi sisa tagihan (${rp(bal)}).`);
        const method = f.querySelector('#p-method').value, val = sel => { const n = f.querySelector(sel); return n ? n.value.trim() : ''; };
        const pay = { id: uid('pay'), date: f.querySelector('#p-date').value || today(), amount: amt, method, note: val('#p-note') };
        if (method === 'Transfer bank') {
          const acc = id_ => accs.find(a => a.id === id_);
          pay.transfer = incoming
            ? { to: acc(val('#p-to')) ? accLabel(acc(val('#p-to'))) : '', from: val('#p-from'), sender: val('#p-sender'), ref: val('#p-ref'), verified: f.querySelector('#p-ver').checked }
            : { from: acc(val('#p-from')) ? accLabel(acc(val('#p-from'))) : '', to: val('#p-to'), ref: val('#p-ref'), verified: f.querySelector('#p-ver').checked };
        }
        const cur = incoming ? S.D.orders[id] : S.D.purchases[id];
        await saving($$('button', f), async () => {
          await Store.patch(incoming ? 'orders' : 'purchases', id, { payments: (cur.payments || []).concat([pay]) });
          if (!incoming && method === 'Transfer bank' && pay.transfer.to && !sup.bankAcc && S.D.suppliers[sup.id]) {
            const mm = pay.transfer.to.match(/^(\S+(?:\s(?:Jatim|Niaga))?)\s+([\d\-. ]{5,})(?:\s+a\.n\.\s+(.+))?$/);
            if (mm) await Store.patch('suppliers', sup.id, { bank: mm[1], bankAcc: mm[2].trim(), bankHolder: mm[3] || '' });
          }
          m.close(); toast(`Pembayaran ${rp(amt)} tercatat untuk ${cur.no}`, 'good');
        });
      });
    }
  });
}

const BANKS = ['BCA', 'BRI', 'Mandiri', 'BNI', 'BSI', 'Bank Jatim', 'BTN', 'CIMB Niaga', 'Permata', 'Danamon', 'OCBC', 'Maybank', 'Bank lainnya'];
function accountsOf(c) {
  c = c || cfg();
  if (Array.isArray(c.accounts) && c.accounts.length) return c.accounts.slice().sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0));
  return c.bankAcc ? [{ id: 'acc-legacy', bank: c.bankName || '', acc: c.bankAcc, holder: c.bankHolder || c.bizName || '', primary: true }] : [];
}
const accLabel = a => `${a.bank} ${a.acc}${a.holder ? ' a.n. ' + a.holder : ''}`.trim();
function payDetail(p) {
  const t = p.transfer; if (!t) return '';
  return [t.from && t.to ? `${t.from} → ${t.to}` : (t.to ? '→ ' + t.to : t.from), t.sender ? 'pengirim ' + t.sender : '', t.ref ? 'ref ' + t.ref : ''].filter(Boolean).join(' · ');
}
async function saveAccounts(list) {
  const cur = Object.assign({}, DEFAULTS, S.D.settings.main || {});

      `<label class="check span-2"><input type="checkbox" id="ac-primary" ${a.primary ? 'checked' : ''}> Rekening utama (tampil paling atas di faktur)</label>`,

    async onSubmit(v, f, m) {

async function deleteAccount(id) {
  if (!guardWrite()) return;

  const next = list.filter(x => x.id !== id).map(x => Object.assign({}, x));
  if (next.length && !next.some(x => x.primary)) next[0].primary = true;

  await saving([], async () => { await Store.patch(col, docId, { payments }); toast(now ? 'Transfer ditandai sudah dicek' : 'Transfer ditandai belum dicek', 'good'); });
}
function unverifiedTransfers(x) {
  const out = [];
  x.orders.forEach(o => (o.payments || []).forEach(p => { if (p.transfer && !p.transfer.verified) out.push({ o, p }); }));
  return out;
}

      };
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const w = f.querySelector('#lf-who').value;
        if (!w) return formError(el, 'Pilih mitra dulu, atau pilih "Mitra baru".');

            key_ = 'l:' + id;

            await Store.patch(p.col, p.id, { lat, lng }); key_ = p.key;
          }

          toast('Lokasi mitra disimpan', 'good');

        }).catch(() => {});
      });
    }
  });
}

function doExport(what) {

  const [name, head, rows] = fn();
  if (!rows.length) return toast('Tidak ada data untuk diekspor dengan filter ini.', 'warn');
  const EN_FILE = { pesanan: 'orders', pelanggan: 'customers', pembelian: 'purchases', pemasok: 'suppliers', 'batch-stok': 'stock-batches', 'mutasi-stok': 'stock-movements', piutang: 'receivables', hutang: 'payables', pembayaran: 'payments', biaya: 'expenses', 'laba-rugi': 'profit-loss', 'penjualan-per-produk': 'sales-by-product', 'penjualan-per-pelanggan': 'sales-by-customer', 'pembelian-per-pemasok': 'purchases-by-supplier', 'lokasi-mitra': 'partner-locations' };
  const fname = LANG === 'en' ? name.replace(/^[a-z]+(?:-[a-z]+)*/, k => EN_FILE[k] || k) : name;
  const h2 = LANG === 'en' ? head.map(trHead) : head, r2 = LANG === 'en' ? rows.map(r => r.map(c => typeof c === 'string' ? tr(c) : c)) : rows;
  saveFile(/\d{4}-\d{2}-\d{2}$/.test(fname) ? `${fname}.csv` : `${fname}-${today()}.csv`, csvOf(h2, r2), 'text/csv');
}

$('#imp-file').addEventListener('change', e => {

    const data = obj && obj.data; if (!data || typeof data !== 'object') return toast('File ini tidak berisi data cadangan JPN Group.', 'crit');
    const ops = []; COLS.forEach(c => { const m = data[c]; if (m && typeof m === 'object') for (const id in m) if (/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id) && m[id] && typeof m[id] === 'object') ops.push({ col: c, id, doc: m[id] }); });
    if (!ops.length) return toast('Cadangan kosong.', 'warn');

  if (!guardWrite()) return;
  const P = buildDemo(today()).products, ops = Object.keys(P).filter(id => !S.D.products[id]).map(id => ({ col: 'products', id, doc: P[id] }));
  if (!ops.length) return toast('Produk standar sudah ada.', '');
  await bulk(ops, 'Membuat produk'); toast('3 produk standar dibuat. Sesuaikan harga dan stok minimumnya.', 'good'); go('stok');
}

/* ---------- order status changes ---------- */
async function orderAction(act, id) {
  const o = S.D.orders[id]; if (!o || !guardWrite()) return;
  const T = today();
  if (act === 'confirm-order') return saving([], async () => { await Store.patch('orders', id, { status: 'dikonfirmasi', confirmedDate: T }); toast(`${o.no} dikonfirmasi`, 'good'); });
  if (act === 'done-order') return saving([], async () => { await Store.patch('orders', id, { status: 'selesai', doneDate: T }); toast(`${o.no} diterima pelanggan`, 'good'); });
  if (act === 'restore-order') return saving([], async () => { await Store.patch('orders', id, { status: 'draft', cancelledDate: '' }); toast(`${o.no} dipulihkan ke draft`, 'good'); });
  if (act === 'cancel-order') { if (await confirmBox({ title: `Batalkan ${o.no}?`, text: 'Pesanan ditandai batal dan keluar dari antrean kirim. Anda bisa memulihkannya nanti.', ok: 'Batalkan pesanan', danger: true })) await saving([], async () => { await Store.patch('orders', id, { status: 'batal', cancelledDate: T }); toast(`${o.no} dibatalkan`, 'good'); }); return; }
  if (act === 'unship-order') {
    if ((o.payments || []).length) return toast('Pesanan ini sudah punya pembayaran. Hapus pembayarannya dulu sebelum membatalkan pengiriman.', 'warn');
    if (await confirmBox({ title: `Batalkan pengiriman ${o.no}?`, text: `Stok ${kgf(orderKg(o))} dikembalikan ke batch asalnya dan pesanan kembali ke status dikonfirmasi. Faktur tidak berlaku lagi.`, ok: 'Batalkan pengiriman', danger: true }))
      await saving([], async () => { await Store.patch('orders', id, { status: 'dikonfirmasi', shippedDate: '', dueDate: '', doneDate: '', fifo: [] }); toast(`Pengiriman ${o.no} dibatalkan, stok dikembalikan`, 'good'); });
    return;
  }
  if (act === 'del-order') {
    if (isShipped(o)) return toast('Pesanan yang sudah dikirim tidak bisa dihapus. Batalkan pengirimannya dulu.', 'warn');
    if (await confirmBox({ title: `Hapus ${o.no}?`, text: 'Pesanan dihapus permanen.', ok: 'Hapus', danger: true })) await saving([], async () => { await Store.remove('orders', id); toast(`${o.no} dihapus`, 'good'); });
  }
}
async function removeWithCheck(col, id, label, blocker) {
  if (!guardWrite()) return;
  const d = S.D[col][id]; if (!d) return;
  if (blocker) return toast(blocker, 'warn');
  if (!(await confirmBox({ title: `Hapus ${label}?`, text: 'Data ini akan dihapus permanen.', ok: 'Hapus', danger: true }))) return;
  await saving([], async () => { await Store.remove(col, id); MODALS.slice().reverse().forEach(m => { if (m.live && m.live() == null) m.close(); }); toast(`${label} dihapus`, 'good'); });
}

/* ---------- click delegation ---------- */
const ACTIONS = {
  go: d => go(d.to),
  'go-bill': () => { S.f.billTab = 'hutang'; go('tagihan'); render(); },
  setf: d => { S.f[d.k] = d.v; requestAnim('live'); rerender(); },
  refresh: () => refreshView(),
  theme: () => toggleTheme(),
  'acc-add': () => openAccountForm(null), 'acc-edit': d => openAccountForm(d.id), 'acc-del': d => deleteAccount(d.id),
  'pay-verify': d => toggleVerify(d.kind, d.id, d.pid),
  'go-pay': () => { S.f.billTab = 'riwayat'; S.f.payMethod = 'belum'; if (S.route === 'tagihan') { requestAnim('live'); render(); } else go('tagihan'); },
  lang: () => toggleLang(),
  'loc-add': d => openLocForm(null, { kind: d.kind }),
  'loc-edit': d => openLocForm(d.key),
  'map-sel': d => { S.f.mapSel = d.key; const p = partnerPoints(X()).find(q => q.key === d.key); if (p && p.src !== 'belum') { S.f.mapCx = p.lng; S.f.mapCy = p.lat; S.f.mapZ = Math.max(S.f.mapZ, 2); } rerender(); const mp = document.querySelector('.map'); if (mp) mp.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  'map-kind': d => { const k = new Set(S.f.mapKinds.split(',').filter(Boolean)); if (k.has(d.v)) k.delete(d.v); else k.add(d.v); S.f.mapKinds = [...k].join(','); rerender(); },
  'month-step': d => { const md = parseISO(S.f[d.k] + '-01'); md.setMonth(md.getMonth() + Number(d.d)); const m = iso(md).slice(0, 7); if (m > monthOf(today())) return; S.f[d.k] = m; rerender(); },
  'nav-open': () => document.body.classList.add('nav-open'),
  'nav-close': () => document.body.classList.remove('nav-open'),
  ack: async d => {
    if (!guardWrite()) return;
    const keys = new Set(buildAlerts(X()).map(a => a.key)), cur = ackMap(), map = {};
    Object.keys(cur).forEach(k => { if (keys.has(k)) map[k] = cur[k]; });
    if (map[d.key]) delete map[d.key]; else map[d.key] = today();
    await saving([], async () => { await Store.put('settings', { id: 'acks', map }); toast(map[d.key] ? 'Ditandai sudah ditangani' : 'Ditandai belum ditangani', 'good'); });
  },
  'create-menu': () => { const m = $('#create-menu'), open = m.hidden; m.innerHTML = CREATE.map(([a, l, i]) => `<button type="button" data-act="${a}">${I[i]}${l}</button>`).join(''); m.hidden = !open; $('#create-btn').setAttribute('aria-expanded', String(open)); },
  'new-order': d => openOrderForm(null, { customerId: d.cust }),
  'open-order': d => openOrder(d.id),
  'edit-order': d => openOrderForm(d.id),
  'ship-order': d => openShip(d.id),
  'confirm-order': d => orderAction('confirm-order', d.id), 'done-order': d => orderAction('done-order', d.id), 'cancel-order': d => orderAction('cancel-order', d.id),
  'unship-order': d => orderAction('unship-order', d.id), 'restore-order': d => orderAction('restore-order', d.id), 'del-order': d => orderAction('del-order', d.id),
  pay: d => openPay(d.kind, d.id),
  'pay-pick': () => { S.f.billTab = 'piutang'; go('tagihan'); render(); toast('Pilih faktur lalu tekan Catat bayar.', ''); },
  'pay-del': async d => {
    if (!guardWrite()) return;
    const col = d.kind === 'order' ? 'orders' : 'purchases', doc = S.D[col][d.id]; if (!doc) return;
    const p = (doc.payments || []).find(q => q.id === d.pid); if (!p) return;
    if (await confirmBox({ title: 'Hapus pembayaran?', text: `Pembayaran ${rp(p.amount)} tanggal ${dmy(p.date)} akan dihapus dan tagihan kembali terbuka.`, ok: 'Hapus', danger: true }))
      await saving([], async () => { await Store.patch(col, d.id, { payments: (S.D[col][d.id].payments || []).filter(q => q.id !== d.pid) }); toast('Pembayaran dihapus', 'good'); });
  },
  doc: d => openDoc(d.id, d.kind),
  'doc-dl': d => { const o = S.D.orders[d.id]; if (!o) return; const t = LANG === 'en' ? (d.kind === 'faktur' ? 'Invoice' : 'Delivery Note') : (d.kind === 'faktur' ? 'Faktur' : 'Surat Jalan'); const tmp = document.createElement('div'); tmp.innerHTML = paperHTML(o, d.kind); translateTree(tmp); saveFile(`${t} ${o.no}.html`, `<!doctype html><html lang="${LANG}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${t} ${esc(o.no)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&display=swap"><style>body{margin:0;background:#efefea;padding:24px}${PAPER_CSS}@media print{body{background:#fff;padding:0}.paper{box-shadow:none}}</style></head><body>${tmp.innerHTML}</body></html>`, 'text/html'); },
  'wa-copy': d => { const o = S.D.orders[d.id]; if (o) copyText(waText(o), 'Pesan tagihan disalin. Tempel di WhatsApp.'); },
  'wa-remind': d => { const o = S.D.orders[d.id]; if (o) copyText(waText(o), 'Pengingat tagihan disalin. Tempel di WhatsApp pelanggan.'); },
  copy: d => copyText(d.text, 'Disalin'),
  'new-customer': () => openCustomerForm(null), 'open-customer': d => openCustomer(d.id), 'edit-customer': d => openCustomerForm(d.id),
  'del-customer': d => removeWithCheck('customers', d.id, (S.D.customers[d.id] || {}).name || 'pelanggan', Object.values(S.D.orders).some(o => o.customerId === d.id) ? 'Pelanggan ini punya riwayat pesanan sehingga tidak bisa dihapus. Ubah datanya bila perlu.' : ''),
  'new-supplier': () => openSupplierForm(null), 'open-supplier': d => openSupplier(d.id), 'edit-supplier': d => openSupplierForm(d.id),
  'del-supplier': d => removeWithCheck('suppliers', d.id, (S.D.suppliers[d.id] || {}).name || 'pemasok', Object.values(S.D.purchases).some(p => p.supplierId === d.id) ? 'Pemasok ini punya riwayat pembelian sehingga tidak bisa dihapus.' : ''),
  'new-purchase': d => openPurchaseForm(null, { productId: d.prod, supplierId: d.sup }), 'open-purchase': d => openPurchase(d.id), 'edit-purchase': d => openPurchaseForm(d.id), receive: d => openReceive(d.id),
  'cancel-purchase': async d => { const p = S.D.purchases[d.id]; if (p && guardWrite() && await confirmBox({ title: `Batalkan ${p.no}?`, text: 'Pembelian ditandai batal. Anda bisa memulihkannya nanti.', ok: 'Batalkan', danger: true })) await saving([], async () => { await Store.patch('purchases', d.id, { status: 'batal' }); toast(`${p.no} dibatalkan`, 'good'); }); },
  'restore-purchase': d => guardWrite() && saving([], async () => { await Store.patch('purchases', d.id, { status: 'dipesan' }); toast('Pembelian dipulihkan', 'good'); }),
  'del-purchase': d => { const p = S.D.purchases[d.id] || {}, b = X().batchMap[d.id]; removeWithCheck('purchases', d.id, p.no || 'pembelian', b && (b.used || b.adj) ? 'Batch dari pembelian ini sudah dipakai atau dikoreksi, jadi tidak bisa dihapus.' : (p.payments || []).length ? 'Hapus pembayarannya dulu.' : Object.values(S.D.adjustments).some(a => a.batchId === d.id) ? 'Hapus penyesuaian stok batch ini dulu.' : ''); },
  adjust: d => openAdjust(d.id),
  'del-adj': d => removeWithCheck('adjustments', d.id, 'penyesuaian stok', ''),
  'new-product': () => openProductForm(null), 'edit-product': d => openProductForm(d.id),
  'del-product': d => removeWithCheck('products', d.id, (S.D.products[d.id] || {}).name || 'produk', Object.values(S.D.orders).some(o => (o.items || []).some(i => i.productId === d.id)) || Object.values(S.D.purchases).some(p => p.productId === d.id) ? 'Produk ini sudah dipakai di transaksi. Nonaktifkan saja.' : ''),
  'seed-products': () => seedProducts(),
  'new-vehicle': () => openVehicleForm(null), 'edit-vehicle': d => openVehicleForm(d.id), 'del-vehicle': d => removeWithCheck('vehicles', d.id, (S.D.vehicles[d.id] || {}).name || 'kendaraan', ''),
  'new-expense': () => openExpenseForm(null), 'edit-expense': d => openExpenseForm(d.id), 'del-expense': d => removeWithCheck('expenses', d.id, 'biaya', ''),
  export: d => doExport(d.what),
  backup: () => backup(),
  restore: () => { if (guardWrite()) $('#imp-file').click(); },
  'load-demo': () => loadDemo(),
  'clear-demo': () => clearDemo(),
  'clear-all': () => clearAll()
};
document.addEventListener('click', e => {
  const cl = e.target.closest('[data-close]');
  if (cl) { const layer = cl.closest('.modal-layer'), m = MODALS.find(q => q.el === layer); if (m) m.close(); return; }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.tagName === 'A' && t.dataset.act === 'go') e.preventDefault();
  const act = t.dataset.act, fn = ACTIONS[act];
  if (!fn) return;
  if (t.dataset.search) { sres.hidden = true; gs.value = ''; gs.blur(); }
  if (act !== 'create-menu') closeCreate();
  if (t.dataset.closeup) { const layer = t.closest('.modal-layer'), m = MODALS.find(q => q.el === layer); if (m) m.close(); }
  fn(Object.assign({}, t.dataset), t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#create-menu').hidden) return closeCreate(); if (document.body.classList.contains('nav-open')) return document.body.classList.remove('nav-open'); const m = MODALS[MODALS.length - 1]; if (m) { m.close(); e.preventDefault(); } return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act],div[data-act].ship,div[data-act].rw')) { e.preventDefault(); e.target.click(); return; }
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K') && !MODALS.length) { e.preventDefault(); gs.focus(); gs.select(); return; }
  if (e.key === '/' && !e.target.closest('input,textarea,select,[contenteditable]') && !MODALS.length) { e.preventDefault(); gs.focus(); }
});
let ft = 0;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest && t.closest('form[data-preserve]')) { t.dataset.dirty = '1'; return; }
  const k = t.dataset && t.dataset.f; if (!k) return;
  S.f[k] = t.value;
  clearTimeout(ft);
  if (t.type === 'search' || t.type === 'text') ft = setTimeout(rerender, 140); else rerender();
});
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id !== 'f-profile' && f.id !== 'f-ops') return;
  e.preventDefault();
  if (!guardWrite()) return;
  const v = id => (f.querySelector('#' + id) || {}).value || '';
  const cur = Object.assign({}, DEFAULTS, S.D.settings.main || {});
  let patch;
  if (f.id === 'f-profile') patch = { bizName: v('s-bizName').trim(), owner: v('s-owner').trim(), phone: v('s-phone').trim(), address: v('s-address').trim(), invoiceNote: v('s-invoiceNote').trim() };
  else {
    patch = { sackKg: num(v('s-sackKg')), defaultTerm: num(v('s-defaultTerm')), ageWarn: num(v('s-ageWarn')), ageCrit: num(v('s-ageCrit')), capacityKg: num(v('s-capacityKg')) || DEFAULTS.capacityKg };
    if (!(patch.sackKg > 0)) return toast('Berat per sak harus lebih dari 0.', 'crit');
    if (!(patch.ageWarn > 0) || patch.ageCrit <= patch.ageWarn) return toast('Batas "risiko tengik" harus lebih besar dari batas "perhatikan".', 'crit');
  }
  await saving($$('button', f), async () => { await Store.put('settings', Object.assign(cur, patch, { id: 'main' })); $$('[data-dirty]', f).forEach(el => { delete el.dataset.dirty; }); toast('Pengaturan disimpan', 'good'); });
});

/* ---------- boot ---------- */
document.head.insertAdjacentHTML('beforeend', `<style>${PAPER_CSS}</style>`);
render();
Store.init().catch(err => { console.error(err); S.mode = 'local'; Store.loadLocal(); COLS.forEach(c => S.loaded.add(c)); touch(); });
setInterval(() => { if (cache && cache.x.T !== today()) touch(); }, 60000);
})();
